---
default_stages: [pre-commit, pre-push]

# Hooks never touch generated or third-party trees: Vale's synced
# style packages arrive via `vale sync` and follow upstream style,
# and dist/ holds build output. Installed packages need no entry,
# because git tracks nothing under node_modules/.
exclude: ^(\.vale/(Google|write-good|proselint|ai-tells.*)/|dist/)

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: d32b532e2f5ba703ba06a5a6829f9db1fc78a92c  # frozen: v3.15.2
    hooks:
      # Scope the pre-commit-stage hook to the file types .vale.ini
      # actually configures rules for (Markdown + TypeScript source).
      # The upstream hook defaults to types: [text], which passes
      # every text file plus .git/COMMIT_EDITMSG; vale then parses the
      # commit-message buffer as plain text (no extension), backticks
      # lose their code-span meaning, and rules like Google.Spacing
      # flag dotted identifiers even inside backticks. The
      # vale-commit-msg hook from proofhouse/pre-commit-hooks (below)
      # handles the commit message with a strip-and-vale pipeline that
      # drops git's helper comments and the verbose-diff scissors
      # block before invoking vale. Extend types_or when .vale.ini
      # grows a new section.
      - id: vale
        types_or: [markdown, ts]
        # Agent output template from the proofhouse package: one
        # machine-parseable line per finding.
        args: [--output=proofhouse-agent.tmpl]
        # CHANGELOG.md is generated by `cog changelog`, whose Title-Case
        # section headings ("Bug Fixes", "Continuous Integration") are a
        # cocogitto convention, not prose under this project's control.
        # The prose recipes (lint-prose, lint-markdown) already skip it
        # via --glob; .vale.ini cannot exempt it on its own because the
        # explicit per-rule toggles in [*.md] survive an empty
        # BasedOnStyles in the CHANGELOG.md block. Exclude it here too.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 75cad3ecfe02b58e8165d3ac08d117bee207ed3d  # frozen: v0.2.43
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  # Shared commit-msg gates. All four run on the commit-msg stage (see the
  # manifest); commitlint and commit-trailers need only bash/git, while
  # vale-commit-msg and cspell-commit-msg lean on this repo's vale/cspell
  # plus the commit-message scope in .vale.ini and .cspell.jsonc.
  # commitlint here is a bash port of the retired Go commitlint binary.
  # Pinned by SHA with a `# frozen:` tag comment so Renovate's pre-commit
  # manager tracks it, the same as the other hook repos above.
  - repo: https://github.com/proofhouse/pre-commit-hooks
    rev: 72e252992cbcdf4a503b7ce9145cdaf48bdc0cb9  # frozen: v0.3.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg

  # Every local hook naming a JavaScript tool spells out its path under
  # node_modules/.bin. A package manager wrapper would re-resolve the
  # tree first, and the only guard against it rewriting the lockfile
  # mid-hook is the verifyDepsBeforeRun setting in pnpm-workspace.yaml.
  # A hook has no business depending on that backstop.
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: node_modules/.bin/biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # The compiler reads the whole program whatever it is handed, so
      # scoping the run to the staged files would buy nothing and would
      # miss the callers a changed signature breaks. A full pass under
      # tsc7 measures around a fifth of a second on this tree.
      - id: typecheck
        name: tsc typecheck
        entry: just typecheck
        language: system
        types: [ts]
        pass_filenames: false

      # The workspace file carries the resolution and supply-chain
      # settings, so an edit to it re-verifies the lockfile the same as
      # an edit to the manifest does.
      - id: lock-check
        name: pnpm-lock.yaml drift check
        entry: pnpm install --frozen-lockfile --lockfile-only
        language: system
        files: ^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$
        pass_filenames: false

      # Whitespace conventions from .editorconfig. The builtin
      # end-of-file-fixer / mixed-line-ending / trailing-whitespace
      # hooks above cover part of the same ground with fixed rules;
      # this one adds what they do not read at all — charset, the
      # tab-versus-space indent style, and the per-glob sections
      # .editorconfig declares. No file filter and no filenames: the
      # checker walks the git index itself, and the exclusions live in
      # .editorconfig-checker.json.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        pass_filenames: false

      # Nothing else reads the Justfile's layout, so its formatting
      # drifts unless just's own formatter checks it. --check mode, to
      # match every other formatting hook here: report the drift and
      # fail rather than rewrite a file mid-commit. Run `just
      # format-just` to apply.
      - id: just-fmt
        name: just --fmt check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off
      # the commit-msg stage so the cspell-commit-msg hook from
      # proofhouse/pre-commit-hooks owns the commit buffer with
      # worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: node_modules/.bin/cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      # Tests gate a push rather than a commit, the way every sibling
      # repository here arranges them: a commit stays cheap enough to
      # make mid-thought, and the suite still runs before anything
      # leaves the machine.
      - id: vitest
        name: vitest
        entry: node_modules/.bin/vitest run
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
