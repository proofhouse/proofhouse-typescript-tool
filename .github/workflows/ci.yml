---
# Main quality gate. Every pull request and every push to `main` runs
# the whole lint set, the compiler over the sources and the tests, the
# test suite across the runners and Node releases this package
# supports, the coverage those runs report once merged, the lock-drift
# check, and the smoke suite that reads the sources as raw TypeScript.
# Each of those is its
# own job, so a flake in one costs a rerun of that one alone and the
# status list names which gate turned the change away.
#
# The lint job runs `just lint` rather than the source gates alone. The
# text-quality checks reached a contributor only through the pre-commit
# hooks until now, and `git commit --no-verify` walks straight past
# those. Their binaries come from three places: vale and tombi from the
# pinned composites in proofhouse/github-actions, rumdl, yamllint, and
# editorconfig-checker from the Brewfile, biome and cspell from the
# lockfile.
#
# Every job installs `just` from a SHA-pinned casey/just release
# tarball and then calls the matching `just <recipe>`, which keeps the
# Justfile the single answer to what any one gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The header gate runs reuse through uvx rather than out of the
      # lockfile, so the runner needs uv on its PATH. A developer
      # machine gets the same binary from the Brewfile.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation. It goes ahead of the two composites below, each of
      # which prepends its own directory and so lands in front of this
      # one.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # vale and tombi arrive from pinned release archives rather than
      # from the Brewfile, verified against upstream checksums and a
      # digest recorded in the action. Both gates are strict enough that
      # an upstream release moves findings on its own, so the version
      # each one runs belongs under review like every other pin. The
      # composites take no version input here: their defaults are the
      # organization pins.
      - name: Set up vale
        uses: proofhouse/github-actions/.github/actions/setup-vale@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up tombi
        uses: proofhouse/github-actions/.github/actions/setup-tombi@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # Covers the gates whose tools sit in neither the lockfile nor a
      # composite: rumdl, yamllint, and editorconfig-checker.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # No version input: the action reads the packageManager field, so
      # the pinned pnpm follows package.json. It has to precede the Node
      # setup, whose pnpm cache asks the binary where the store lives.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # biome and cspell run out of node_modules, so the lint job needs
      # the dependency tree as much as the test job does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vale resolves its styles from .vale/, which `vale sync`
      # populates from the Packages list in .vale.ini. Without this
      # lint-prose fails on a missing style rather than on prose.
      - name: Sync Vale styles
        run: just install-tools

      - name: Lint
        run: just lint

  # The lint job already reaches the compiler through `just lint`. A job of
  # its own gives the type gate a name in the status list, so a compile error
  # reads as one on the pull request instead of hiding inside a lint failure
  # among a dozen other gates. The run costs under a second.
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # The compiler comes out of the dependency tree under the tsc7 alias.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: just typecheck

  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # The recipe resolves against the manifest and stops there, so it
      # needs no install ahead of it.
      - name: Check lock drift
        run: just lock-check

  test:
    name: "test (${{ matrix.os }}, node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    # Publishing a slot's coverage report needs the code-quality write
    # scope. A job-level block replaces the workflow default rather than
    # adding to it, so the reads come along again: contents for the
    # checkout, pull-requests so the upload action can look up a pull
    # request number on a push event.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
        node:
          - '22.23.2'
          - '24.18.1'
          - '26.5.1'
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The floor applies to every slot, not to the matrix as a whole.
      # These sources hold no branch that reads the platform, so a
      # runner or a Node release that cannot reach some line is a
      # finding about the code rather than a reason to relax a slot.
      - name: Run tests with coverage
        run: just cover

      # Two destinations for one file. The first publishes this slot's
      # numbers under a label of their own, so the pull request shows
      # which runner and which Node release produced them. The second
      # stashes the raw report for the job below to merge, and fails the
      # step outright when the file it names is missing.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage/lcov.info
          language: TypeScript
          label: code-coverage/${{ matrix.os }}-node${{ matrix.node }}
          fail-on-error: false

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Twelve slots each proved the floor on their own. This job asks the
  # question the slots cannot: whether the twelve reports describe the
  # same tree. The merge normalizes what the runners disagree about and
  # then re-checks the totals, so a slot that measured a smaller
  # denominator than the rest turns up as a mismatch rather than as a
  # green run nobody read.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: test
    # Same scopes as the per-slot uploads above, for the same reason.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The diff check below reads the history between this branch and
      # its base, which the default shallow clone does not carry.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # diff-cover comes from PyPI through uvx, the same way the header
      # gate reaches reuse.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # The merger runs out of the dependency tree; the checker beside
      # it needs nothing but Node.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every slot named its report lcov.info, so merging the downloads
      # into one directory would leave eleven of the twelve overwritten.
      # Without that flag each artifact lands in a directory named after
      # itself and the merge recipe globs the lot.
      - name: Download per-slot coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          path: reports/coverage

      - name: Merge coverage and check the merged report
        run: just cover-merge

      # A pull request hears about an uncovered line it introduced
      # before the merged total would report the same thing as a
      # percentage. diff-cover compares against the base branch, which a
      # pull request checkout leaves without a tracking ref, so fetch it
      # first. The base ref exists on pull requests alone.
      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just cover-diff "origin/${{ github.base_ref }}" coverage/merged.info

      - name: Upload combined coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage/merged.info
          language: TypeScript
          label: code-coverage/combined
          fail-on-error: false

  erasable:
    name: erasable
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke suite runs on the runtime alone, with no vitest and no
      # transform in front of it, so it reaches its first assertion only
      # if Node stripped the types off the entry point and everything it
      # imports. Under vitest the same files would compile first, and a
      # construct the runtime cannot erase would slip by unremarked.
      - name: Run the erasable suite
        run: just test-erasable
